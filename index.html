<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Alquileres</title>
<meta name="theme-color" content="#2E5B4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alquileres">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.anon .side,.anon .tabs{display:none!important}
.anon .app{grid-template-columns:1fr}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.login .brand{padding:0;font-size:1.5rem}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
</style>
<style>
/* Layout: barra lateral fija + columna de trabajo; en el celular, barra de pestañas translúcida abajo.
   Criterios de la skill apple-design: tipografía del sistema con tracking según tamaño, respuesta al presionar,
   materiales translúcidos para la navegación, hojas que suben desde abajo en el celular. */
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --sunk:#E8EBE7; --ink:#161D1A; --muted:#5A6761; --line:#DADFDB;
  --accent:#2E5B4D; --accent-ink:#FFFFFF; --accent-soft:#DCE9E2;
  --crit:#B42318; --crit-soft:#FCE9E7; --warn:#9A5B06; --warn-soft:#FBEFD8;
  --info:#2C5A86; --info-soft:#E2ECF6; --ok:#2B7A44; --ok-soft:#E0F1E5;
  --chrome:rgba(255,255,255,.74); --chrome-edge:rgba(255,255,255,.6); --scrim:rgba(12,18,15,.42);
  --shadow-lg:0 18px 50px rgba(15,25,20,.18),0 2px 8px rgba(15,25,20,.08);
  --f-display:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-body:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-mono:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:12px; --spring:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111613; --surface:#19201C; --sunk:#222B26; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2C3631;
  --accent:#7DC2A9; --accent-ink:#0E1A15; --accent-soft:#1F3229;
  --crit:#F4867B; --crit-soft:#3A1E1B; --warn:#F2B455; --warn-soft:#352812;
  --info:#8DB8E3; --info-soft:#1B2A3A; --ok:#7BCB93; --ok-soft:#18301F;
  --chrome:rgba(25,32,28,.74); --chrome-edge:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.55); --shadow-lg:0 18px 50px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#19201C; --sunk:#222B26; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2C3631;
  --accent:#7DC2A9; --accent-ink:#0E1A15; --accent-soft:#1F3229;
  --crit:#F4867B; --crit-soft:#3A1E1B; --warn:#F2B455; --warn-soft:#352812;
  --info:#8DB8E3; --info-soft:#1B2A3A; --ok:#7BCB93; --ok-soft:#18301F;
  --chrome:rgba(25,32,28,.74); --chrome-edge:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.55); --shadow-lg:0 18px 50px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .9375rem/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.875rem;line-height:1.1;letter-spacing:-.025em}
h2{font-size:1.125rem;line-height:1.25;letter-spacing:-.012em;font-weight:650}
h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--f-body);font-weight:600}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.2rem;padding:0 10px 18px;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:.8rem}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--crit);color:#fff;font-size:.72rem;display:inline-grid;place-items:center;font-weight:600}
.side .foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 10px}

main{min-width:0}
.wrap{max-width:1080px;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0;color:var(--muted)}
.tabs{display:none}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-alta,.p-alquilado-no{background:var(--crit-soft);color:var(--crit)}
.p-media{background:var(--warn-soft);color:var(--warn)}
.p-baja{background:var(--info-soft);color:var(--info)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-neutral{background:var(--sunk);color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--f-display);font-size:1.55rem;margin-top:4px;line-height:1.2;overflow-wrap:anywhere}
.kpi b.crit{color:var(--crit)}
.kpi small{color:var(--muted)}

.list{display:flex;flex-direction:column;gap:8px}
.al{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--info);border-radius:var(--r);padding:11px 14px;cursor:pointer}
.al:hover{border-color:var(--muted)}
.al.s-alta{border-left-color:var(--crit)} .al.s-media{border-left-color:var(--warn)} .al.s-baja{border-left-color:var(--info)}
.al-k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.al-t{font-weight:600;grid-column:1;min-width:0}
.al-w{font-weight:400;color:var(--muted)}
.al-m{grid-column:1;font-size:.88rem;color:var(--muted)}
.al-d{grid-column:2;grid-row:1/4;align-self:center;font-family:var(--f-mono);font-size:.86rem;font-weight:500;text-align:right}
.s-alta .al-d{color:var(--crit)} .s-media .al-d{color:var(--warn)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.card:hover{border-color:var(--muted)}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h2{font-size:1.1rem}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.r{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) auto;gap:4px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.r:first-child{border-top:0}
.r.click{cursor:pointer} .r.click:hover{background:var(--sunk)}
.r .main{min-width:0;font-weight:600}
.r .main small,.r .sub{display:block;font-weight:400;color:var(--muted);font-size:.87rem}
.r .end{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.r .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
dl.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 20px;margin:0}
dl.info dt{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
dl.info dd{margin:2px 0 0;overflow-wrap:anywhere}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-weight:500;align-self:flex-start}
.back:hover{color:var(--ink)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);font-size:.92rem}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-top:0}
td.num,th.num{text-align:right}
tr.late td{background:var(--crit-soft)}
tr.paid td{color:var(--muted)}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--ink);font-size:1.05rem}
.note{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.note.info{background:var(--info-soft)}
.muted{color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(680px,calc(100% - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
dialog{box-shadow:var(--shadow-lg);border-radius:16px}
dialog[open]{animation:dlg-in 380ms var(--spring)}
dialog[open]::backdrop{animation:fade 250ms ease}
@keyframes dlg-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
/* Respuesta inmediata al presionar (apple-design §1) */
.btn,.chip,.card,.al,.r.click,.tabs a,.nav a{transition:transform 120ms ease-out,background-color 150ms ease,border-color 150ms ease}
.btn:active:not(:disabled),.chip:active{transform:scale(.97)}
.card:active,.al:active,.r.click:active{transform:scale(.985)}
.tabs a:active{transform:scale(.92)}
.al-d,.amt,.tot,.kpi b{font-variant-numeric:tabular-nums}
.kpi b{letter-spacing:-.02em}
.side{background:var(--sunk)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.x{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.db{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.85rem;font-weight:600}
.fld label b{color:var(--crit)}
.fld small,.hint{color:var(--muted);font-size:.8rem;margin:0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;flex-direction:row}
.chk input{width:auto}
.fld.chk{align-self:end;padding-bottom:8px}
fieldset.svc{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0;display:flex;flex-direction:column;gap:10px}
fieldset.svc legend{font-weight:600;padding:0 6px}
.srow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,.8fr);gap:8px;align-items:center}
.df{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.df .sp{flex:1}
.ferr{color:var(--crit);margin:0;font-weight:500}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2)}

.result{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-weight:500}
.result b{font-family:var(--f-display);font-size:1.3rem}
.paper{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.paper .ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.paper .ph b{font-family:var(--f-display);font-size:1.1rem}
.paper p{margin:0}
.paper .tot{font-family:var(--f-mono);font-size:1.1rem;font-weight:500}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 37px,var(--sunk) 37px 38px)}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars i.zero{background:var(--line)}
.blabels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;font-size:.72rem;color:var(--muted);text-align:center;margin-top:6px}
tfoot td{font-weight:600}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-top:20px}
  h1{font-size:1.45rem}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92vh;border-bottom:0}
  dialog[open]{animation:sheet-in 420ms var(--spring)}
  .df{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--chrome);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-top:1px solid var(--chrome-edge);box-shadow:0 -1px 0 var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.64rem;font-weight:600;padding:6px 1px;border-radius:8px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .tabs svg{width:20px;height:20px}
  .tabs .badge{position:absolute;top:0;right:4px;height:16px;min-width:16px;font-size:.62rem;padding:0 4px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .r{grid-template-columns:minmax(0,1fr)}
  .r .end{justify-content:flex-start}
}
@media (max-width:520px){
  .fgrid{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr 1fr}
  .srow .chk{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-transparency:reduce){.tabs{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){:root{--line:#87928C}.tabs{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>

</head>
<body class="anon">
<div class="app">
  <nav class="side" aria-label="Secciones">
    <div class="brand"><i aria-hidden="true">MA</i>Mis Alquileres</div>
    <div class="nav" id="nav"></div>
    <div class="foot"><span id="who"></span><br><button class="btn sm ghost" data-act="salir" style="margin-top:8px">Cerrar sesión</button></div>
  </nav>
  <main><div class="wrap" id="main"></div></main>
</div>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const HOY=isoOf(new Date());
const dias=s=>Math.round((parse(s)-parse(HOY))/864e5);
function addMonths(s,n){const d=parse(s);const day=d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return isoOf(t)}
const fmtF=s=>s?parse(s).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}):'—';
const mesLabel=per=>{const[y,m]=per.split('-').map(Number);const t=new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)};
function money(n,cur){if(n==null||n==='')return '—';try{return new Intl.NumberFormat('es-AR',{style:'currency',currency:cur||'ARS',maximumFractionDigits:0}).format(n)}catch{return (cur||'')+' '+n}}
const moneyMap=o=>Object.entries(o).filter(([,n])=>n).map(([c,n])=>money(n,c)).join(' + ')||'$ 0';
function letras(n){
  n=Math.round(n);if(n===0)return 'cero';
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const c3=x=>{if(!x)return '';if(x===100)return 'cien';const c=Math.floor(x/100),r=x%100;let s=C[c];if(r)s+=(s?' ':'')+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:''));return s};
  const ap=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const mi=Math.floor(n/1e6),ml=Math.floor(n%1e6/1000),r=n%1000,p=[];
  if(mi)p.push(mi===1?'un millón':ap(c3(mi))+' millones');
  if(ml)p.push(ml===1?'mil':ap(c3(ml))+' mil');
  if(r)p.push(c3(r));
  return p.join(' ');
}
function waNum(t){
  let d=String(t||'').replace(/\D/g,'');if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9')&&d.length===11)d=d.slice(1);if(d.startsWith('0'))d=d.slice(1);
  if(d.length===12)for(const i of [2,3,4])if(d.substr(i,2)==='15'){d=d.slice(0,i)+d.slice(i+2);break}
  return '549'+d;
}

function cuotas(c){
  if(!c.inicio||!c.fin)return[];
  const out=[];let y=+c.inicio.slice(0,4),m=+c.inicio.slice(5,7);
  const f=parse(c.fin);f.setDate(f.getDate()-1);const ey=f.getFullYear(),em=f.getMonth()+1;let g=0;
  while((y<ey||(y===ey&&m<=em))&&g++<240){
    const per=`${y}-${pad(m)}`,last=new Date(y,m,0).getDate();
    const vto=`${per}-${pad(Math.min(+c.diaVto||10,last))}`,monto=montoDe(c,per),pago=c.pagos?.[per]||null;
    let punit=0;if(!pago&&+c.punitorio>0){const atraso=-dias(vto);if(atraso>0)punit=Math.round(monto*(+c.punitorio)/100*atraso)}
    out.push({per,vto,monto,punit,pago});
    m++;if(m>12){m=1;y++}
  }
  return out;
}
/* monto vigente para un mes, respetando el historial de ajustes */
function montoDe(c,per){
  const h=(c.ajustesHist||[]).slice().sort((a,b)=>a.desde.localeCompare(b.desde));
  if(!h.length)return c.monto;
  let m=c.montoInicial??h[0].anterior??c.monto;
  for(const a of h)if(a.desde<=per)m=a.monto;
  if(per>=h[h.length-1].desde)m=c.monto;
  return m;
}
function ajustes(c){const k=+c.ajusteMeses||0;if(!k||!c.inicio||!c.fin)return[];const r=[];for(let i=1;i<240;i++){const f=addMonths(c.inicio,k*i);if(f>=c.fin)break;r.push(f)}return r}
const deudaMeses=c=>c.estado==='vigente'?cuotas(c).filter(q=>!q.pago&&dias(q.vto)<0).length:0;

function alertas(){
  const A=[];
  for(const c of Object.values(S.contratos)){
    if(c.estado!=='vigente')continue;
    const where=ali(c.inmuebleId),who=nom(c.inquilinoId);
    if(c.fin){const d=dias(c.fin);if(d<=60)A.push({sev:d<=15?'alta':d<=30?'media':'baja',key:'contrato',kind:d<0?'Contrato vencido':'Contrato por vencer',title:d<0?'Venció el contrato y sigue vigente en la app':'Termina el contrato',where,who,fecha:c.fin,dias:d,act:'det-con',id:c.id})}
    for(const q of cuotas(c)){if(q.pago)continue;const d=dias(q.vto);if(d>5)break;
      A.push({sev:d<0?'alta':'media',key:'cuota',kind:d<0?'Alquiler atrasado':'Alquiler por cobrar',title:'Alquiler de '+mesLabel(q.per),where,who:who+(q.punit?' · incluye punitorios':''),fecha:q.vto,dias:d,monto:q.monto+q.punit,moneda:c.moneda,act:'det-con',id:c.id})}
    for(const f of ajustes(c)){const d=dias(f);if(d>=0&&d<=15)A.push({sev:'media',key:'ajuste',kind:'Ajuste de alquiler',title:'Ajuste por '+(L.indice[c.indice]||c.indice||'índice'),where,who,fecha:f,dias:d,monto:c.monto,moneda:c.moneda,act:'det-con',id:c.id})}
  }
  for(const s of Object.values(S.servicios)){
    if(s.pagado||!s.vence)continue;const d=dias(s.vence);if(d>10)continue;
    A.push({sev:d<0?'alta':d<=3?'media':'baja',key:'servicio',kind:d<0?'Impuesto o servicio vencido':'Impuesto o servicio por vencer',title:(L.tipoServ[s.tipo]||'Servicio')+(s.periodo?' '+s.periodo:''),where:ali(s.inmuebleId),who:'Paga: '+(L.resp[s.responsable]||'a definir').toLowerCase(),fecha:s.vence,dias:d,monto:s.monto,moneda:s.moneda,act:'edit',col:'servicios',id:s.id});
  }
  for(const a of Object.values(S.arreglos)){
    if(a.estado==='resuelto')continue;
    A.push({sev:a.prioridad||'media',key:'arreglo',kind:'Arreglo '+(a.estado==='en_proceso'?'en proceso':'pendiente'),title:a.titulo||'Arreglo',where:ali(a.inmuebleId),who:a.proveedor||'Sin proveedor',fecha:a.fecha||HOY,dias:a.fecha?dias(a.fecha):0,monto:a.costo,moneda:a.moneda,act:'edit',col:'arreglos',id:a.id});
  }
  const o={alta:0,media:1,baja:2};
  return A.sort((x,y)=>(o[x.sev]??1)-(o[y.sev]??1)||x.dias-y.dias);
}
function cuando(d,key){
  if(key==='arreglo')return d===0?'Reportado hoy':`Abierto hace ${-d} d`;
  if(d<0)return `Vencido hace ${-d} d`;if(d===0)return 'Vence hoy';if(d===1)return 'Vence mañana';return `En ${d} días`;
}

  return `<button class="back" data-act="back">← Volver</button>

  <div class="panel"><dl class="info">
    <div><dt>Período</dt><dd>${fmtF(c.inicio)} → ${fmtF(c.fin)}</dd></div>
    <div><dt>Alquiler mensual</dt><dd class="num">${money(c.monto,c.moneda)}</dd></div>
    <div><dt>Vence cada mes el día</dt><dd>${esc(c.diaVto||10)}</dd></div>
    <div><dt>Depósito en garantía</dt><dd class="num">${money(c.deposito,c.depositoMoneda)}</dd></div>
    <div><dt>Ajuste</dt><dd>${+c.ajusteMeses?`${esc(L.indice[c.indice]||c.indice)} cada ${esc(c.ajusteMeses)} meses`:'Sin ajuste'}</dd></div>
    <div><dt>Próximo ajuste</dt><dd>${prox?fmtF(prox):'—'}</dd></div>
    <div><dt>Interés por mora</dt><dd>${+c.punitorio?esc(c.punitorio)+'% por día':'No cobra'}</dd></div>
    <div><dt>Garante</dt><dd>${c.garanteId?esc(nom(c.garanteId)):'—'}</dd></div>
    <div><dt>Contrato digital</dt><dd>${[doc,link].filter(Boolean).join(' · ')||'Sin adjuntar'}</dd></div>
    ${c.notas?`<div style="grid-column:1/-1"><dt>Notas</dt><dd>${esc(c.notas)}</dd></div>`:''}
  </dl></div>
  <div class="head"><h3>Cuotas de alquiler · ${cobrado} de ${qs.length} cobradas</h3></div>
  <div class="rows scroll"><table><thead><tr><th>Mes</th><th>Vence</th><th class="num">Monto</th><th>Estado</th><th></th></tr></thead><tbody>
  ${qs.map(q=>{const d=dias(q.vto),late=!q.pago&&d<0;
    const monto=q.pago?(+q.pago.monto||0)+(+q.pago.punitorio||0):q.monto+q.punit;
    const btns=[];
    if(q.pago){btns.push(`<button class="btn sm" data-act="recibo" data-id="${esc(c.id)}" data-per="${q.per}">Recibo</button>`);if(ui.canWrite)btns.push(`<button class="btn sm ghost" data-act="pago" data-id="${esc(c.id)}" data-per="${q.per}">Deshacer</button>`)}

    <td>${q.pago?`<span class="pill p-ok">Cobrado ${fmtF(q.pago.fecha)}</span>`:late?`<span class="pill p-alta">Atrasado ${-d} d</span>`:d<=5?'<span class="pill p-media">Por cobrar</span>':'<span class="pill p-neutral">Pendiente</span>'}</td>

  </tbody></table></div>
  ${aj.length?`<p class="muted">Fechas de ajuste: ${aj.map(f=>`<span class="${f===prox?'pill p-media':''}">${fmtF(f)}</span>`).join(' · ')}. Usá "Aplicar ajuste" para calcular el nuevo monto y avisarle al inquilino.</p>`:''}

}

function fieldHTML(f,val){
  const id='f_'+f.k;
  if(f.t==='check')return `<label class="fld chk" for="${id}"><input type="checkbox" id="${id}" name="${f.k}"${val?' checked':''}> ${esc(f.l)}</label>`;
  let inp;
  if(f.t==='select'){const opts=typeof f.opt==='function'?f.opt():f.opt;
    inp=`<select id="${id}" name="${f.k}">${f.blank?`<option value="">${esc(f.blank)}</option>`:''}${opts.map(([a,b])=>`<option value="${esc(a)}"${String(val??'')===a?' selected':''}>${esc(b)}</option>`).join('')}</select>`}
  else if(f.t==='textarea')inp=`<textarea id="${id}" name="${f.k}" rows="3">${esc(val??'')}</textarea>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(val??'')}" placeholder="${esc(f.ph||'')}"${f.t==='number'?' inputmode="decimal" step="any" min="0"':''}>`;
  return `<div class="fld${f.full||f.t==='textarea'?' full':''}"><label for="${id}">${esc(f.l)}${f.req?' <b>*</b>':''}</label>${inp}${f.hint?`<small>${esc(f.hint)}</small>`:''}</div>`;
}
function contratoExtras(doc){

    ?`<input type="file" id="f_archivo" name="archivo" accept="application/pdf,image/jpeg,image/png,image/webp">${doc?.docId?`<small>Ya tiene adjunto: ${esc(doc.docNombre||'contrato')}. Si elegís otro archivo, lo reemplaza.</small>`:'<small>PDF, JPG o PNG de hasta 20 MB.</small>'}`
    :'<small>Para adjuntar archivos tenés que ser editor de esta app. Podés pegar un link de Drive en el campo de arriba.</small>'}</div>`;
  if(!doc)h+=`<fieldset class="svc"><legend>Impuestos y servicios de este contrato</legend>
    <p class="hint">Tildá los que correspondan, indicá quién paga y la fecha del próximo vencimiento. Van a aparecer en las alertas.</p>

  </fieldset>`;
  return h;
}

  const E=form.elements,rows=[];
  for(const[t]of SVC_DEF){if(!E[`s_${t}_on`]?.checked)continue;
    const vence=E[`s_${t}_vence`].value;if(!vence)return{err:`Poné la fecha del próximo vencimiento de ${L.tipoServ[t]}, o destildalo.`};
    const m=E[`s_${t}_monto`].value;rows.push({tipo:t,responsable:E[`s_${t}_resp`].value,vence,monto:m===''?null:Number(m)})}
  return{rows};
}
async function submitForm(col,id,form){
  const def=FORMS[col],data={},faltan=[];
  for(const f of def.fields){const el=form.elements[f.k];let v;
    if(f.t==='check')v=el.checked;else if(f.t==='number')v=el.value===''?null:Number(el.value);else v=el.value.trim();
    if(f.req&&(v===''||v==null||Number.isNaN(v)))faltan.push(f.l);data[f.k]=v}
  if(faltan.length)return ferr('Completá: '+faltan.join(', ')+'.');
  const m=def.check?.(data,id);if(m)return ferr(m);
  let svc={rows:[]};if(col==='contratos'&&!id){svc=svcRows(form);if(svc.err)return ferr(svc.err)}
  if(col==='arreglos'&&data.estado==='resuelto'&&!(id&&S.arreglos[id]?.fechaResuelto))data.fechaResuelto=HOY;
  const b=$('#fsave');b.disabled=true;b.textContent='Guardando…';$('#ferr').hidden=true;
  try{
    if(col==='contratos')await guardarContrato(id,data,form,svc.rows);
    else await save(col,id,data);
    dlg.close();toast(id?'Cambios guardados':'Guardado');
  }catch(e){ferr(errMsg(e));b.disabled=false;b.textContent=id?'Guardar cambios':'Guardar'}
}
async function guardarContrato(id,data,form,rows){
  const file=form.elements.archivo?.files?.[0];
  if(file){if(!assets)throw{code:'noassets'};
    const ext=file.name.split('.').pop().toLowerCase();
    const type=file.type||({pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'})[ext];
    const r=await assets.upload(file,type?{type}:undefined);data.docId=r.id;data.docNombre=file.name}
  const cid=await save('contratos',id,data);
  const inm=I(data.inmuebleId);
  if(inm){const nuevo=data.estado==='vigente'?'alquilado':(inm.estado==='alquilado'?'libre':inm.estado);if(inm.estado!==nuevo)await save('inmuebles',inm.id,{estado:nuevo})}
  for(const s of rows)await save('servicios',null,{...s,inmuebleId:data.inmuebleId,contratoId:cid,pagado:false,moneda:'ARS',empresa:'',cuenta:'',periodo:'',notas:''});
}

/* ---------- caja y números ---------- */
function numerosData(year){
  const porInm={},movs=[],mensual=Array.from({length:12},()=>({}));
  const acc=(inm,k,mon,n)=>{const o=porInm[inm]??={ing:{},egr:{}};o[k][mon]=(o[k][mon]||0)+n};
  for(const c of Object.values(S.contratos))for(const[per,p]of Object.entries(c.pagos||{})){
    if(!p||!per.startsWith(year))continue;const n=(+p.monto||0)+(+p.punitorio||0),mon=c.moneda||'ARS';
    acc(c.inmuebleId,'ing',mon,n);const mm=+per.slice(5,7)-1;mensual[mm][mon]=(mensual[mm][mon]||0)+n;
    movs.push({fecha:p.fecha||per+'-01',inm:ali(c.inmuebleId),concepto:'Alquiler '+mesLabel(per)+' · '+nom(c.inquilinoId),tipo:'Ingreso',monto:n,moneda:mon});
  }
  for(const s of Object.values(S.servicios)){const f=s.fechaPago||s.vence;
    if(!s.pagado||s.responsable!=='propietario'||!+s.monto||!String(f).startsWith(year))continue;
    acc(s.inmuebleId,'egr',s.moneda||'ARS',+s.monto);
    movs.push({fecha:f,inm:ali(s.inmuebleId),concepto:(L.tipoServ[s.tipo]||'Servicio')+(s.periodo?' '+s.periodo:''),tipo:'Gasto',monto:+s.monto,moneda:s.moneda||'ARS'})}
  for(const a of Object.values(S.arreglos)){const f=a.fechaResuelto||a.fecha;
    if(a.responsable!=='propietario'||!+a.costo||!String(f).startsWith(year))continue;
    acc(a.inmuebleId,'egr',a.moneda||'ARS',+a.costo);
    movs.push({fecha:f,inm:ali(a.inmuebleId),concepto:'Arreglo: '+a.titulo,tipo:'Gasto',monto:+a.costo,moneda:a.moneda||'ARS'})}
  movs.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
  return{porInm,movs,mensual};
}
const sumMap=(a,b,sg=1)=>{const o={...a};for(const[k,v]of Object.entries(b))o[k]=(o[k]||0)+sg*v;return o};

/* ---------- escritura ---------- */
const queues={};
function q(path,fn){const p=(queues[path]||Promise.resolve()).then(fn);queues[path]=p.catch(()=>{});return p}
async function save(col,id,data){
  const ref=id?db.collection(col).doc(id):db.collection(col).doc();
  await q(ref.path,()=>id&&S[col][id]?ref.update(data):ref.set(data));
  return ref.id;
}
async function remove(col,id){const ref=db.collection(col).doc(id);await q(ref.path,()=>ref.delete())}
function errMsg(e){
  switch(e?.code){
    case 'noassets':return 'No podés adjuntar archivos con tu permiso actual. Pegá un link en su lugar.';
    case 'unsupported_type':return 'Ese tipo de archivo no se puede subir. Usá PDF, JPG o PNG (las fotos HEIC del iPhone, convertilas a JPG).';
    case 'too_large':return 'El archivo pesa más de 20 MB. Comprimilo o sacá una foto más liviana.';
    case 'quota_exceeded':case 'quota_or_state':return 'Se llenó el espacio de la app. Borrá registros o archivos viejos.';
    case 'invalid_argument':ui.canWrite=false;return 'No tenés permiso para modificar estos datos.';
    default:return 'No se pudo guardar. Revisá la conexión y probá de nuevo.';
  }
}

/* ---------- acciones ---------- */
document.addEventListener('click',async e=>{
  const nav=e.target.closest('a[data-nav]');
  if(nav){if(location.hash.slice(1)===nav.dataset.nav||(!location.hash&&nav.dataset.nav==='panel')){e.preventDefault();ui.detail=null;ui.view=nav.dataset.nav;render();window.scrollTo(0,0)}return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const {act,id,col}=b.dataset;
  try{switch(act){
    case 'chip':ui[b.dataset.key]=b.dataset.v;render();break;
    case 'signup':await signup();break;
    case 'olvide':await olvide();break;
    case 'salir':await sb.auth.signOut();break;
    case 'ver-doc':e.preventDefault();await verDoc(id);break;
    case 'new':if(!db)return;openForm(col,null,b.dataset.inm?{inmuebleId:b.dataset.inm}:{});break;
    case 'edit':if(!db)return;openForm(col,id);break;
    case 'close':dlg.close();break;
    case 'det-con':ui.detail={type:'con',id,from:ui.detail};ui.armFin=null;render();window.scrollTo(0,0);break;
    case 'det-inm':ui.detail={type:'inm',id,from:ui.detail};render();window.scrollTo(0,0);break;
    case 'back':ui.detail=ui.detail?.from||null;ui.armFin=null;render();window.scrollTo(0,0);break;
    case 'pago':{const c=S.contratos[id],per=b.dataset.per,pg=c.pagos?.[per],q=cuotas(c).find(x=>x.per===per);b.disabled=true;
      await save('contratos',id,{pagos:{[per]:pg?null:{fecha:HOY,monto:q?.monto??c.monto,punitorio:q?.punit||0}}});toast(pg?'Cobro deshecho':'Cobro registrado. Ya podés hacer el recibo.');break}
    case 'avisar':{const c=S.contratos[id],q=cuotas(c).find(x=>x.per===b.dataset.per);if(q)avisoCuota(c,q);break}
    case 'recibo':openRecibo(id,b.dataset.per);break;
    case 'pdf':b.disabled=true;await reciboPDF(id,b.dataset.per);b.disabled=false;break;
    case 'wa-recibo':waRecibo(id,b.dataset.per);break;
    case 'ajuste':openAjuste(id);break;
    case 'csv':await bajarCSV();break;
    case 'copy-msg':{const t=$('#m_txt');try{await navigator.clipboard.writeText(t.value);toast('Texto copiado')}catch{t.focus();t.select();toast('Texto seleccionado: copialo con Ctrl+C o mantené apretado')}break}
    case 'finalizar':{if(ui.armFin!==id){ui.armFin=id;render();break}
      const c=S.contratos[id];ui.armFin=null;await save('contratos',id,{estado:'finalizado'});
      const inm=I(c.inmuebleId);if(inm&&inm.estado==='alquilado')await save('inmuebles',inm.id,{estado:'libre'});toast('Contrato finalizado');break}
    case 'svc-pay':b.disabled=true;await save('servicios',id,{pagado:true,fechaPago:HOY});toast('Marcado como pagado');break;
    case 'svc-next':{const s=S.servicios[id];b.disabled=true;await save('servicios',id,{pagado:true,fechaPago:HOY});
      const n={...s};delete n.id;delete n.fechaPago;delete n.ejemplo;n.pagado=false;n.vence=addMonths(s.vence,1);
      if(/^\d{1,2}\/\d{4}$/.test(s.periodo||'')){const[mm,yy]=s.periodo.split('/').map(Number);const d=new Date(yy,mm,1);n.periodo=`${pad(d.getMonth()+1)}/${d.getFullYear()}`}
      await save('servicios',null,n);toast('Pagado. Se cargó el vencimiento del '+fmtF(n.vence));break}
    case 'arr-estado':b.disabled=true;await save('arreglos',id,b.dataset.v==='resuelto'?{estado:'resuelto',fechaResuelto:HOY}:{estado:b.dataset.v});toast('Arreglo actualizado');break;
    case 'del':{
      if(col==='inmuebles'&&vigente(id)){ferr('Este departamento tiene un contrato vigente. Finalizalo antes de eliminarlo.');break}
      if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmar: eliminar';break}
      b.disabled=true;const doc=S[col][id];await remove(col,id);
      if(col==='contratos'){if(doc?.docId&&assets){try{await assets.delete(doc.docId)}catch{}}
        const inm=I(doc?.inmuebleId);if(doc?.estado==='vigente'&&inm?.estado==='alquilado')await save('inmuebles',inm.id,{estado:'libre'});
        if(ui.detail?.id===id)ui.detail=ui.detail.from||null}
      if(col==='inmuebles'&&ui.detail?.id===id)ui.detail=null;
      dlg.close();toast('Eliminado');render();break}
    case 'borrar-ej':{if(!ui.armEj){ui.armEj=true;render();break}
      ui.armEj=false;b.disabled=true;b.textContent='Borrando…';
      for(const c of COLS)for(const d of Object.values(S[c]))if(d.ejemplo)await remove(c,d.id);
      toast('Ejemplos borrados. ¡A cargar lo tuyo!');break}
  }}catch(err){toast(errMsg(err));if(dlg.open&&$('#ferr'))ferr(errMsg(err));render()}
});

/* ---------- conexión con Supabase ---------- */
const SB_URL='https://iqrmjysewmjqtsaphlat.supabase.co',SB_KEY='sb_publishable_O42WcA3peXoxGjLQLDWgOw_kcmD9EJL';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let session=null;
const cache={},listeners={};
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function deepMerge(a,b){const o={...(a||{})};for(const[k,v]of Object.entries(b)){o[k]=isObj(v)&&isObj(o[k])?deepMerge(o[k],v):v}return o}
const mapErr=e=>({code:e?.code==='42501'?'invalid_argument':'unavailable',message:e?.message||''});
function emit(col){const fn=listeners[col];if(fn)fn({docs:Object.entries(cache[col]||{}).map(([id,d])=>({id,data:()=>d})),metadata:{fromCache:false}})}
async function loadCol(col){const{data,error}=await sb.from(col).select('id,data');if(error)throw mapErr(error);cache[col]={};data.forEach(r=>cache[col][r.id]=r.data);emit(col)}
function docRef(col,id){
  id=id||crypto.randomUUID();
  return{id,path:col+'/'+id,
    async set(d){const{error}=await sb.from(col).upsert({id,data:d});if(error)throw mapErr(error);(cache[col]??={})[id]=d;emit(col)},
    async update(p){const cur=cache[col]?.[id];if(!cur)throw{code:'invalid_argument'};const nd=deepMerge(cur,p);const{error}=await sb.from(col).update({data:nd}).eq('id',id);if(error)throw mapErr(error);cache[col][id]=nd;emit(col)},
    async delete(){const{error}=await sb.from(col).delete().eq('id',id);if(error)throw mapErr(error);if(cache[col])delete cache[col][id];emit(col)}};
}
const dbSB={collection(col){return{doc:id=>docRef(col,id),onSnapshot(next,err){listeners[col]=next;loadCol(col).catch(e=>err&&err(e));return()=>{delete listeners[col]}}}}};
const assetsSB={
  async upload(file,opts){const ext=(file.name.split('.').pop()||'pdf').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${session.user.id}/${crypto.randomUUID()}.${ext}`;
    const{error}=await sb.storage.from('contratos').upload(path,file,{contentType:opts?.type||file.type});
    if(error)throw{code:/mime|type/i.test(error.message)?'unsupported_type':/size|large|exceed/i.test(error.message)?'too_large':'upstream_error'};return{id:path}},
  async delete(id){await sb.storage.from('contratos').remove([id])}};
const downloadsLocal={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'application/octet-stream'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return{status:'saved'}}};
async function verDoc(path){
  const w=window.open('','_blank');
  const{data,error}=await sb.storage.from('contratos').createSignedUrl(path,600);
  if(error||!data){w&&w.close();toast('No se pudo abrir el archivo.');return}
  if(w)w.location.href=data.signedUrl;else location.href=data.signedUrl;
}

function vNuevaClave(){
  return `<div class="login"><div class="brand"><i aria-hidden="true">MA</i>Mis Alquileres</div>

    <h2>Elegí tu contraseña nueva</h2>
    <div class="fld"><label for="n_pass">Contraseña nueva</label><input id="n_pass" type="password" autocomplete="new-password" minlength="6"><small>Al menos 6 caracteres. Anotala en un lugar seguro.</small></div>

async function olvide(){
  const email=$('#l_email').value.trim();ui.lastEmail=email;lmsg('lerr','');lmsg('lok','');
  if(!email)return lmsg('lerr','Escribí tu email arriba y tocá de nuevo "Olvidé mi contraseña".');
  const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error)return lmsg('lerr','No se pudo enviar el mail. Esperá un minuto y probá de nuevo.');
  lmsg('lok','Listo: te mandamos un mail. Abrilo en este mismo dispositivo, tocá el enlace y vas a poder elegir una contraseña nueva.');
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='nf')return;e.preventDefault();
  const p=$('#n_pass').value,er=$('#nerr');er.hidden=true;
  if(p.length<6){er.textContent='Tiene que tener al menos 6 caracteres.';er.hidden=false;return}
  const b=$('#n_go');b.disabled=true;b.textContent='Guardando…';
  const{error}=await sb.auth.updateUser({password:p});
  if(error){b.disabled=false;b.textContent='Guardar contraseña';er.textContent='No se pudo guardar. Probá con otra contraseña.';er.hidden=false;return}
  ui.recover=false;history.replaceState(null,'',location.pathname);toast('Contraseña nueva guardada');render();
});
function lmsg(id,t){const e=$('#'+id);if(e){e.textContent=t;e.hidden=!t}}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='lf')return;e.preventDefault();
  const email=$('#l_email').value.trim(),password=$('#l_pass').value;ui.lastEmail=email;
  lmsg('lerr','');lmsg('lok','');if(!email||!password)return lmsg('lerr','Completá tu email y tu contraseña.');
  const b=$('#l_go');b.disabled=true;b.textContent='Entrando…';
  const{error}=await sb.auth.signInWithPassword({email,password});
  if(error){b.disabled=false;b.textContent='Entrar';
    lmsg('lerr',/confirm/i.test(error.message)?'Tu acceso está creado pero falta activarlo. Abrí el mail que te llegó y tocá el enlace, o pedile a Claude que lo active.':/invalid/i.test(error.message)?'El email o la contraseña no coinciden.':'No se pudo entrar. Revisá tu conexión y probá de nuevo.')}
});
async function signup(){
  const email=$('#l_email').value.trim(),password=$('#l_pass').value;ui.lastEmail=email;lmsg('lerr','');lmsg('lok','');
  if(!email||password.length<6)return lmsg('lerr','Escribí tu email y una contraseña de al menos 6 caracteres, y tocá de nuevo.');
  const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error)return lmsg('lerr',/already|registered/i.test(error.message)?'Ese email ya tiene acceso. Tocá "Entrar".':'No se pudo crear el acceso: '+error.message);
  if(!data.session)lmsg('lok','¡Acceso creado! Te llegó un mail para activarlo: tocá el enlace (si la página que abre da error, no importa). Después volvé acá y tocá "Entrar".');
}

/* ---------- arranque ---------- */
function startData(){
  db=dbSB;assets=assetsSB;downloads=downloadsLocal;ui.status='loading';
  document.body.classList.remove('anon');const w=$('#who');if(w)w.textContent=session.user.email||'';
  const got=new Set();
  const timer=setTimeout(()=>{if(ui.status==='loading'){ui.status='slow';render()}},10000);
  COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id}});S[c]=m;got.add(c);
    if(got.size===COLS.length&&ui.status!=='ok'){ui.status='ok';clearTimeout(timer)}
    schedule();
  },()=>{clearTimeout(timer);ui.status='error';schedule()}));
}
function stopData(){COLS.forEach(c=>{S[c]={};cache[c]={};delete listeners[c]});db=null;ui.status='login';ui.detail=null;document.body.classList.add('anon')}
async function init(){
  ui.view=VIEWS.some(v=>v[0]===location.hash.slice(1))?location.hash.slice(1):'panel';
  const{data}=await sb.auth.getSession();session=data.session;
  if(session)startData();else{ui.status='login';document.body.classList.add('anon')}
  render();
  sb.auth.onAuthStateChange((ev,s)=>{const was=!!session;session=s;
    if(ev==='PASSWORD_RECOVERY'){ui.recover=true;if(!was&&s)startData();render();return}
    if(s&&!was){startData();render()}else if(!s&&was){stopData();render()}});
  if(/type=recovery/.test(location.hash)){ui.recover=true;render()}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session&&db)COLS.forEach(c=>loadCol(c).catch(()=>{}))});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
})();
